name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name (e.g. 1.0.1)"
        required: false
        default: "1.0"
      version_code:
        description: "App version code (integer, increment each release)"
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 3. Setup pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 5. Build Vite web assets (APK bundle) ────────────────────────────────
      - name: Build web assets
        working-directory: artifacts/sunosathi
        env:
          VITE_API_ORIGIN: https://sunosathi.replit.app
          BASE_PATH: /
          VITE_FIREBASE_API_KEY: "AIzaSyBSJTAgAnWk76DOVCgMu8x_3ERQL_b2D4M"
          VITE_FIREBASE_AUTH_DOMAIN: "sunosathi-ef83d.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "sunosathi-ef83d"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "382664320977"
          VITE_FIREBASE_APP_ID: "1:382664320977:web:416f416a4c1a23dca2e2f0"
        run: pnpm run build

      # ── 6. Sync Capacitor (copies dist → android/assets) ─────────────────────
      - name: Capacitor sync
        working-directory: artifacts/sunosathi
        run: npx cap sync android

      # ── 7. Setup Java 17 ─────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 8. Decode OR generate keystore ───────────────────────────────────────
      # GitHub repo → Settings → Secrets → Actions mein ye 4 secrets add karo:
      #   KEYSTORE_BASE64  : base64 string of your .jks file
      #   KEY_ALIAS        : sunosathi
      #   KEY_PASSWORD     : rajan123
      #   STORE_PASSWORD   : rajan123
      #
      # Agar KEYSTORE_BASE64 secret nahi hai toh ek naya keystore auto-generate
      # hoga — logs mein SHA-1 dikhegi. Woh SHA-1 Firebase mein add karo.
      # IMPORTANT: Pehli build ke baad neeche diye steps se keystore save karo
      # warna har build pe naya keystore banega aur SHA-1 change ho jaayegi.
      - name: Decode or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using existing keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/sunosathi.jks
          else
            echo "No keystore secret found — generating a new one for this build..."
            keytool -genkeypair \
              -alias sunosathi \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore /tmp/sunosathi.jks \
              -storepass rajan123 \
              -keypass rajan123 \
              -dname "CN=SunoSathi, OU=Mobile, O=Raj Enterprises, L=India, S=India, C=IN" \
              -noprompt
            echo ""
            echo "================================================================"
            echo "NEW KEYSTORE GENERATED — SAVE THIS BASE64 AS GITHUB SECRET"
            echo "KEYSTORE_BASE64 = $(base64 -w 0 /tmp/sunosathi.jks)"
            echo "================================================================"
          fi
          echo "KEYSTORE_PATH=/tmp/sunosathi.jks" >> $GITHUB_ENV

      # ── 9. Print SHA-1 fingerprint (add this to Firebase Console) ────────────
      - name: Print SHA-1 fingerprint
        run: |
          echo ""
          echo "========================================================"
          echo "  KEYSTORE FINGERPRINTS — SHA1 FIREBASE MEIN DAALNA HAI"
          echo "========================================================"
          keytool -list -v \
            -keystore /tmp/sunosathi.jks \
            -alias sunosathi \
            -storepass rajan123
          echo "========================================================"
          echo ""

      # ── 10. Update version in build.gradle ───────────────────────────────────
      - name: Set version
        working-directory: artifacts/sunosathi/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.version_name }}\"/" build.gradle

      # ── 11. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        working-directory: artifacts/sunosathi/android
        env:
          KEYSTORE_PATH: /tmp/sunosathi.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sunosathi' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'rajan123' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'rajan123' }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 12. Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv artifacts/sunosathi/android/app/build/outputs/apk/release/app-release.apk \
             artifacts/sunosathi/android/app/build/outputs/apk/release/SunoSathi-v${{ github.event.inputs.version_name }}.apk

      # ── 13. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoSathi-v${{ github.event.inputs.version_name }}
          path: artifacts/sunosathi/android/app/build/outputs/apk/release/SunoSathi-v${{ github.event.inputs.version_name }}.apk
          retention-days: 30
