name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name (e.g. 1.0.1)"
        required: false
        default: "1.0"
      version_code:
        description: "App version code (integer, increment each release)"
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Setup pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 5. Build Vite web assets ──────────────────────────────────────────────
      - name: Build web assets
        working-directory: artifacts/sunosathi
        env:
          VITE_API_ORIGIN: https://sunosathi.replit.app
          BASE_PATH: /
          VITE_FIREBASE_API_KEY: "AIzaSyBSJTAgAnWk76DOVCgMu8x_3ERQL_b2D4M"
          VITE_FIREBASE_AUTH_DOMAIN: "sunosathi-ef83d.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "sunosathi-ef83d"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "382664320977"
          VITE_FIREBASE_APP_ID: "1:382664320977:web:416f416a4c1a23dca2e2f0"
        run: pnpm run build

      # ── 6. Capacitor sync ─────────────────────────────────────────────────────
      - name: Capacitor sync
        working-directory: artifacts/sunosathi
        run: npx cap sync android

      # ── 7. Setup Java 17 ─────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── 8. Decode OR auto-generate keystore ──────────────────────────────────
      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/sunosathi.jks
          else
            echo "No KEYSTORE_BASE64 secret — generating a fresh keystore..."
            keytool -genkeypair \
              -alias sunosathi \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore /tmp/sunosathi.jks \
              -storepass rajan123 \
              -keypass rajan123 \
              -dname "CN=SunoSathi,O=RajEnterprises,C=IN" \
              -noprompt
            echo "================================================================"
            echo "SAVE THIS AS GITHUB SECRET 'KEYSTORE_BASE64':"
            echo "$(base64 -w 0 /tmp/sunosathi.jks)"
            echo "================================================================"
          fi
          echo "KEYSTORE_PATH=/tmp/sunosathi.jks" >> $GITHUB_ENV

      # ── 9. Update version ─────────────────────────────────────────────────────
      - name: Set version
        working-directory: artifacts/sunosathi/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.version_name }}\"/" build.gradle

      # ── 10. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        working-directory: artifacts/sunosathi/android
        env:
          KEYSTORE_PATH: /tmp/sunosathi.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sunosathi' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'rajan123' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'rajan123' }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 11. SHA-1 FROM SIGNED APK (100% reliable — no password needed) ────────
      - name: Print SHA-1 fingerprint
        run: |
          APK_PATH="artifacts/sunosathi/android/app/build/outputs/apk/release/app-release.apk"
          echo ""
          echo "###############################################################"
          echo "#   SHA-1 FINGERPRINT — YE FIREBASE CONSOLE MEIN DAALO       #"
          echo "###############################################################"
          keytool -printcert -jarfile "$APK_PATH" 2>/dev/null \
            | grep -E "SHA1:|SHA-1:" \
            | sed 's/.*SHA1:/SHA1:/' \
            | sed 's/.*SHA-1:/SHA1:/'
          echo ""
          echo "Firebase Console → sunosathi-ef83d → Project Settings"
          echo "→ Android app → Add fingerprint → paste above SHA1 → Save"
          echo "###############################################################"
          echo ""
          echo "--- Full cert info (agar upar blank tha toh yahan dekho) ---"
          keytool -printcert -jarfile "$APK_PATH" 2>/dev/null || echo "keytool failed, trying apksigner..."
          APKSIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" 2>/dev/null | sort -r | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH" 2>/dev/null
          fi

      # ── 12. Rename APK ────────────────────────────────────────────────────────
      - name: Rename and upload APK
        run: |
          mv artifacts/sunosathi/android/app/build/outputs/apk/release/app-release.apk \
             artifacts/sunosathi/android/app/build/outputs/apk/release/SunoSathi-v${{ github.event.inputs.version_name }}.apk

      # ── 13. Upload APK ────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoSathi-v${{ github.event.inputs.version_name }}
          path: artifacts/sunosathi/android/app/build/outputs/apk/release/SunoSathi-v${{ github.event.inputs.version_name }}.apk
          retention-days: 30
