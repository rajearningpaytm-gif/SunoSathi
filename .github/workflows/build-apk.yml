name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @workspace/sunosathi run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Capacitor sync
        working-directory: artifacts/sunosathi
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: artifacts/sunosathi/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/sunosathi/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoSathi-debug-apk
          path: artifacts/sunosathi/android/app/build/outputs/apk/debug/app-debug.apk
