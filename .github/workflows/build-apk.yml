name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/sunosathi
        env:
          VITE_API_ORIGIN: https://sunosathi.rajenterprises.info
        run: pnpm run build

      - name: Capacitor sync
        working-directory: artifacts/sunosathi
        run: npx cap sync android

      - name: Guarantee cordova plugins directory
        working-directory: artifacts/sunosathi/android
        run: |
          mkdir -p capacitor-cordova-android-plugins/src/main/java
          if [ ! -f capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            printf 'ext { cordovaAndroidVersion = "14.0.1" }\n' > capacitor-cordova-android-plugins/cordova.variables.gradle
          fi
          if [ ! -f capacitor-cordova-android-plugins/build.gradle ]; then
            printf 'apply plugin: "com.android.library"\napply from: "cordova.variables.gradle"\n\nandroid {\n    namespace "cordovaplugins"\n    compileSdk rootProject.ext.compileSdkVersion\n    defaultConfig {\n        minSdkVersion rootProject.ext.minSdkVersion\n        targetSdkVersion rootProject.ext.targetSdkVersion\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }\n    buildTypes {\n        release { minifyEnabled false }\n        debug {}\n    }\n}\nrepositories { google(); mavenCentral() }\ndependencies {}\n' > capacitor-cordova-android-plugins/build.gradle
          fi
          if [ ! -f capacitor-cordova-android-plugins/src/main/AndroidManifest.xml ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n</manifest>\n' > capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          fi
          echo "=== Cordova plugins dir verified ==="
          ls -la capacitor-cordova-android-plugins/

      - name: Make gradlew executable
        working-directory: artifacts/sunosathi/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/sunosathi/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoSathi-debug-apk
          path: artifacts/sunosathi/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
