name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/sunosathi
        env:
          VITE_API_ORIGIN: https://sunosathi.rajenterprises.info
        run: pnpm run build

      - name: Capacitor sync
        working-directory: artifacts/sunosathi
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: artifacts/sunosathi/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/sunosathi/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoSathi-debug-apk
          path: artifacts/sunosathi/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
