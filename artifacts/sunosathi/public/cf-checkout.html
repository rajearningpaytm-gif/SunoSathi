<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SunoSathi — Payment</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0b14;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .card{background:#1a1a2e;border-radius:16px;padding:28px 22px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.4);}
  .spinner{width:42px;height:42px;border:4px solid #2a2a44;border-top-color:#8b5cf6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:18px;margin:0 0 8px;font-weight:600;}
  p{font-size:14px;color:#9ca3af;margin:0 0 4px;line-height:1.5;}
  .err{color:#ef4444;}
  button{margin-top:18px;background:#8b5cf6;color:#fff;border:0;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  .small{font-size:12px;color:#6b7280;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Payment page khul raha hai…</h1>
    <p id="msg">Cashfree secure checkout load ho raha hai. Ek pal rukein.</p>
    <p class="small">Powered by Cashfree Payments</p>
  </div>
</div>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    var session = q.get("session");
    var env = q.get("env") || "production";
    var title = document.getElementById("title");
    var msg = document.getElementById("msg");
    var spinner = document.getElementById("spinner");
    var card = document.getElementById("card");

    function showError(text){
      spinner.style.display = "none";
      title.textContent = "Payment open nahi ho paya";
      title.classList.add("err");
      msg.textContent = text || "Network problem. Wapas jaa ke dobara try karein.";
      var btn = document.createElement("button");
      btn.textContent = "Wapas jaayein";
      btn.onclick = function(){ try{ window.close(); }catch(e){} history.back(); };
      card.appendChild(btn);
    }

    if (!session) { showError("Session ID nahi mila. App se dobara start karein."); return; }
    if (typeof Cashfree !== "function") { showError("Cashfree SDK load nahi hua. Internet check karein."); return; }

    try {
      var cashfree = Cashfree({ mode: env === "production" ? "production" : "sandbox" });
      cashfree.checkout({
        paymentSessionId: session,
        redirectTarget: "_self"
      });
      // The SDK will navigate away. Keep spinner visible meanwhile.
    } catch (e) {
      showError((e && e.message) ? e.message : "Checkout start nahi hua.");
    }
  })();
</script>
</body>
</html>
